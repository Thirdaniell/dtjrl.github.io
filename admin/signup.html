<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FTJ — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #181818;
    --border: #222222;
    --border2: #2a2a2a;
    --text: #e8e8e8;
    --text2: #888;
    --text3: #444;
    --accent: #c8ff00;
    --red: #ff4444;
    --green: #00e676;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap {
    width: 100%;
    max-width: 360px;
    padding: 2rem;
  }
  .logo {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }
  .logo-sub {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--text3);
    text-transform: uppercase;
    margin-top: 4px;
  }
  .field-label {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 6px;
    margin-top: 20px;
    display: block;
  }
  input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text3); }
  .btn {
    width: 100%;
    margin-top: 28px;
    padding: 11px;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { background: var(--border2); color: var(--text3); cursor: not-allowed; opacity: 1; }
  .error {
    border: 1px solid rgba(255,68,68,0.3);
    background: rgba(255,68,68,0.06);
    color: var(--red);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 9px 12px;
    margin-top: 14px;
    display: none;
  }
  .success {
    border: 1px solid rgba(0,230,118,0.3);
    background: rgba(0,230,118,0.06);
    color: var(--green);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 9px 12px;
    margin-top: 14px;
    display: none;
  }
  .footer {
    margin-top: 24px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text3);
    text-transform: uppercase;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }
  .divider {
    height: 1px;
    background: var(--border);
    margin: 2rem 0 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    // FTJ
    <div class="logo-sub">Futures Trading Journal</div>
  </div>

  <div class="divider"></div>

  <label class="field-label" for="username">Username</label>
  <input type="text" id="username" placeholder="e.g. daniel" autocomplete="username">

  <label class="field-label" for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="email">

  <label class="field-label" for="password">Password</label>
  <input type="password" id="password" placeholder="Min 8 characters" autocomplete="new-password">

  <label class="field-label" for="confirm">Confirm Password</label>
  <input type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password"
    onkeydown="if(event.key==='Enter') signup()">

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <button class="btn" id="btn" onclick="signup()">Create Account →</button>

  <div class="footer" style="margin-top:20px;">
    Have an account? <a href="login.html">Sign in</a>
  </div>
</div>

<script>
const SUPABASE_URL  = 'https://lcpcapiiflkbttghmnzp.supabase.co';
const SUPABASE_ANON = 'sb_publishable_1oAJYzDXoMuUmH_D8PqADA_Vnh6JnVD';

async function signup() {
  const username = document.getElementById('username').value.trim();
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const confirm  = document.getElementById('confirm').value;
  const btn      = document.getElementById('btn');
  const errEl    = document.getElementById('error');
  const sucEl    = document.getElementById('success');

  errEl.style.display = 'none';
  sucEl.style.display = 'none';

  if (!username || !email || !password || !confirm) {
    errEl.textContent = 'Please fill in all fields.';
    errEl.style.display = 'block';
    return;
  }
  if (password.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.style.display = 'block';
    return;
  }
  if (password !== confirm) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Creating account...';

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON },
      body: JSON.stringify({ email, password, data: { username } })
    });
    const data = await res.json();

    if (!res.ok) {
      errEl.textContent = data.msg || data.error_description || 'Signup failed. Try again.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Account →';
      return;
    }

    // Save username to profiles table via worker
    if (data.user?.id) {
      await fetch('https://trade-journal-proxy.daniel-mouldd.workers.dev/sb/profiles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: data.user.id, username })
      });
    }

    sucEl.innerHTML = 'Account created. Check your email to confirm, then <a href="login.html" style="color:var(--green)">sign in</a>.';
    sucEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Account →';

  } catch(e) {
    errEl.textContent = 'Network error. Try again.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Account →';
  }
}
</script>
</body>
</html>
